<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>随心聊 - 绿色清新版</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="authPanel" class="auth-panel">
        <div class="auth-box">
            <h2 id="authTitle">登录账户</h2>
            <form id="authForm" onsubmit="return false;">
                <div class="input-group" id="accountGroup">
                    <label for="account">账号（邮箱/用户名）</label>
                    <input type="text" id="account" placeholder="邮箱或用户名" autocomplete="username">
                </div>
                <div class="input-group" id="usernameGroup" style="display:none;">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="昵称" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
                </div>
                <div style="text-align: right; margin-top: -0.8rem; margin-bottom: 1rem;">
                    <span id="forgotPasswordLink" style="color: var(--primary); cursor: pointer; font-size: 0.8rem;">忘记密码？</span>
                </div>
                <div class="input-group" id="emailGroup" style="display:none;">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="邮箱" autocomplete="email">
                </div>
                <div class="input-group" id="codeGroup" style="display:none;">
                    <label for="verificationCode">验证码</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="verificationCode" placeholder="验证码" style="flex:1;" autocomplete="off">
                        <button type="button" id="getCodeBtn" class="btn-secondary" style="width:auto;">获取验证码</button>
                    </div>
                </div>
                <div class="input-group" id="agreementGroup" style="display:none;">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="agreeAgreement">
                        <span>我已阅读并同意 <a href="#" id="showAgreementLink" style="color: var(--primary);">《用户协议》</a></span>
                    </label>
                </div>
                <div class="input-group">
                    <label>头像</label>
                    <div id="avatarSelectArea" class="avatar-options"></div>
                </div>
                <button id="authBtn" class="btn">登录</button>
                <div class="switch-auth">
                    <span id="switchText">没有账号？立即注册</span>
                </div>
                <div id="authError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <div class="top-nav">
            <div class="logo">💬 随心聊</div>
            <div class="user-area">
                <img id="navAvatar" class="user-avatar" src="" alt="avatar">
                <span id="navUsername"></span>
                <span id="realTimeClock" style="font-size:0.85rem;color:#888;margin:0 12px;"></span>
                <button id="logoutMainBtn" class="logout-icon" title="退出登录">🚪</button>
            </div>
        </div>
        <div class="main-container">
            <div class="welcome-header">
                <h1>欢迎回来</h1>
                <p>选择功能，开始畅聊</p>
            </div>
            <div class="card-grid">
                <a href="/chat" class="card"><div class="card-icon">💬</div><h3>聊天室</h3><p>实时消息，文件分享，表情回复</p></a>
                <a href="/files" class="card"><div class="card-icon">📁</div><h3>网盘</h3><p>个人云存储，文件管理</p></a>
                <a href="/notes" class="card"><div class="card-icon">📝</div><h3>云笔记</h3><p>记录灵感，支持附件</p></a>
                <a href="/profile" class="card"><div class="card-icon">👤</div><h3>个人信息</h3><p>修改资料，更换头像</p></a>
                <a href="/announcements" class="card"><div class="card-icon">📢</div><h3>公告</h3><p>系统通知</p></a>
                <a href="/updates" class="card"><div class="card-icon">📢</div><h3>更新公告</h3><p>查看平台更新动态</p></a>
                <a href="/agreement" class="card"><div class="card-icon">📜</div><h3>用户协议</h3><p>阅读平台用户协议</p></a>
                <a href="/operations" class="card"><div class="card-icon">📊</div><h3>运营数据</h3><p>查看平台运营统计</p></a>
                <a href="/admin" class="card admin-only hidden"><div class="card-icon">⚙️</div><h3>管理面板</h3><p>用户管理，系统设置</p></a>
            </div>
        </div>
    </div>

    <div id="forgotModal" class="modal" style="display:none;">
        <div class="modal-content">
            <form id="resetForm" onsubmit="return false;">
                <h3>找回密码</h3>
                <div class="input-group"><label>注册邮箱</label><input type="email" id="resetEmail" placeholder="请输入注册邮箱" autocomplete="email"></div>
                <div class="input-group"><label>验证码</label><div style="display:flex; gap:8px;"><input type="text" id="resetCode" placeholder="验证码" style="flex:1;" autocomplete="off"><button type="button" id="sendResetCodeBtn" class="btn-secondary">获取验证码</button></div></div>
                <div class="input-group"><label>新密码</label><input type="password" id="resetNewPassword" placeholder="新密码（至少6位)" autocomplete="new-password"></div>
                <div class="input-group"><label>确认新密码</label><input type="password" id="resetConfirmPassword" placeholder="再次输入新密码" autocomplete="new-password"></div>
                <button id="resetPasswordBtn" class="btn">重置密码</button>
                <div id="resetMsg" class="error-msg" style="margin-top:12px;"></div>
                <div style="text-align:center; margin-top:12px;"><span id="closeForgotModal" style="color:#999; cursor:pointer;">取消</span></div>
            </form>
        </div>
    </div>

    <div id="agreementModal" class="modal" style="display:none;">
        <div class="modal-content" style="width: 600px; max-width: 90%;">
            <h3>📜 用户协议</h3>
            <div id="agreementContent" style="max-height: 400px; overflow-y: auto; white-space: pre-wrap; padding: 12px; background: #f9f9f9; border-radius: 12px;"></div>
            <div class="modal-buttons" style="margin-top:16px;">
                <button id="closeAgreementModalBtn">关闭</button>
                <button id="agreeProtocolBtn" class="btn-primary" style="display:none;">同意协议</button>
            </div>
        </div>
    </div>

    <div id="updatesPopupOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;justify-content:center;align-items:center;backdrop-filter:blur(4px);">
        <div id="updatesPopupContent" style="background:white;border-radius:28px;padding:28px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <h2 style="color:var(--primary);margin-bottom:16px;">📢 更新公告</h2>
            <p style="color:#888;font-size:14px;margin-bottom:16px;">以下是最新发布的更新内容：</p>
            <div id="popupUpdates"></div>
            <button id="closePopupBtn" style="width:100%;padding:12px;background:var(--primary);color:white;border:none;border-radius:40px;font-size:16px;cursor:pointer;margin-top:16px;">我知道了</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="common.js"></script>
    <script src="index.js"></script>
</body>
</html>
