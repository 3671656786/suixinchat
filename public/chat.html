<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天室 - 随心聊</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f6fa;
        }

        /* ===== 顶部导航 ===== */
        .chat-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            height: 48px;
            background: #ffffff;
            border-bottom: 1px solid #e8ecf1;
            flex-shrink: 0;
            z-index: 100;
        }
        .chat-nav .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-nav .nav-left .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: #333;
            text-decoration: none;
            padding: 4px 6px;
            border-radius: 8px;
        }
        .chat-nav .nav-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .chat-nav .nav-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-nav .nav-actions button {
            background: none;
            border: none;
            font-size: 18px;
            padding: 4px 6px;
            border-radius: 8px;
            cursor: pointer;
            color: #555;
        }

        /* ===== 主布局 ===== */
        .chat-layout {
            display: flex;
            flex-direction: column;
            height: calc(100% - 48px);
            background: #f5f6fa;
            overflow: hidden;
        }

        /* ===== 群列表（手机端 - 完全可滚动） ===== */
        .group-sidebar {
            flex-shrink: 0;
            background: #ffffff;
            border-bottom: 1px solid #e8ecf1;
            overflow: hidden;
            max-height: 80px;
            /* 允许用户通过点击展开 */
            transition: max-height 0.3s ease;
        }
        .group-sidebar.expanded {
            max-height: 200px;
            overflow-y: auto;
        }
        .group-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            background: #fff;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            flex-shrink: 0;
        }
        .group-sidebar-header .arrow {
            font-size: 10px;
            color: #999;
            transition: transform 0.3s;
        }
        .group-sidebar.expanded .group-sidebar-header .arrow {
            transform: rotate(180deg);
        }
        .group-sidebar-header .actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .group-sidebar-header .actions button {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #666;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .group-list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 0;
            gap: 0;
            flex: 1;
        }
        .group-list::-webkit-scrollbar {
            width: 3px;
        }
        .group-list::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 10px;
        }
        .group-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: background 0.15s;
            min-height: 36px;
            flex-shrink: 0;
        }
        .group-item:active {
            background: #f0f2f5;
        }
        .group-item.active {
            background: #e8f0fe;
            border-left-color: #07c160;
        }
        .group-item .icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .group-item .info {
            flex: 1;
            min-width: 0;
        }
        .group-item .info .name {
            font-size: 13px;
            font-weight: 500;
            color: #1a1a1a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .group-item .info .badge {
            background: #ff4d4f;
            color: #fff;
            font-size: 9px;
            padding: 0 6px;
            border-radius: 10px;
            margin-left: 4px;
        }
        .group-item .info .count {
            font-size: 10px;
            color: #999;
        }

        /* ===== 消息面板 ===== */
        .message-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #f5f6fa;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #ffffff;
            border-bottom: 1px solid #e8ecf1;
            flex-shrink: 0;
        }
        .chat-header .title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-header .actions button {
            background: none;
            border: none;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
            color: #666;
        }

        /* ===== 消息区域 ===== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #f5f6fa;
            scroll-behavior: smooth;
            min-height: 0;
        }
        .messages-area::-webkit-scrollbar {
            width: 3px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 10px;
        }

        .load-more-trigger {
            text-align: center;
            padding: 6px 0;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        /* ===== 消息气泡 ===== */
        .message {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            max-width: 92%;
            animation: messageIn 0.2s ease-out;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-left {
            align-self: flex-start;
        }
        .message-right {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #e8ecf1;
        }

        .message-bubble {
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 14px;
            max-width: calc(100% - 36px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            word-wrap: break-word;
        }
        .message-right .message-bubble {
            background: #d9f0e3;
        }

        .message-name {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            margin-bottom: 2px;
        }
        .message-text {
            font-size: 13px;
            line-height: 1.5;
            color: #1a1a1a;
        }
        .message-text a {
            color: #07c160;
            text-decoration: underline;
            word-break: break-all;
        }
        .message-time {
            font-size: 9px;
            color: #aaa;
            margin-top: 3px;
            text-align: right;
        }

        .message-reply {
            font-size: 11px;
            color: #888;
            background: #f0f2f5;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 3px;
            border-left: 3px solid #07c160;
        }
        .message-reply .reply-name {
            color: #07c160;
            font-weight: 500;
        }

        .file-message {
            margin-top: 3px;
        }
        .file-message img {
            max-width: 140px;
            max-height: 120px;
            border-radius: 8px;
            cursor: pointer;
        }
        .file-message video {
            max-width: 140px;
            max-height: 120px;
            border-radius: 8px;
            background: #000;
        }
        .file-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .file-actions button {
            background: #f0f2f5;
            border: none;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            color: #555;
        }

        .system-message {
            background: #e8ecf1;
            color: #888;
            text-align: center;
            padding: 3px 14px;
            border-radius: 16px;
            font-size: 11px;
            align-self: center;
            max-width: 80%;
        }

        .recall-btn {
            background: none;
            border: none;
            color: #bbb;
            font-size: 10px;
            cursor: pointer;
            margin-left: 6px;
        }
        .recall-btn:hover {
            color: #ff4d4f;
        }

        /* ===== 输入区域 ===== */
        .input-panel {
            background: #ffffff;
            padding: 6px 10px;
            border-top: 1px solid #e8ecf1;
            flex-shrink: 0;
        }
        .reply-bar {
            background: #f5f6fa;
            padding: 4px 10px;
            margin-bottom: 6px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }
        .reply-bar.hidden {
            display: none;
        }
        .reply-bar .reply-content {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .reply-bar .cancel-reply {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }

        .input-area {
            display: flex;
            gap: 6px;
            align-items: center;
            position: relative;
        }
        .input-area .emoji-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 2px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 6px 10px;
            border: 1.5px solid #e8ecf1;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
            min-width: 40px;
            background: #f5f6fa;
        }
        .input-area input:focus {
            border-color: #07c160;
            background: #ffffff;
        }
        .input-area .send-btn {
            background: #07c160;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .input-area .send-btn:active {
            transform: scale(0.95);
        }
        .input-area .file-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 2px;
            flex-shrink: 0;
        }

        .emoji-panel {
            position: absolute;
            bottom: 50px;
            left: 8px;
            background: #ffffff;
            border: 1px solid #e8ecf1;
            border-radius: 14px;
            padding: 8px;
            width: 200px;
            display: none;
            flex-wrap: wrap;
            gap: 3px;
            max-height: 160px;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            z-index: 50;
        }
        .emoji-panel span {
            font-size: 20px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .emoji-panel span:hover {
            background: #f0f2f5;
        }

        /* ===== 在线用户（手机端 - 完全可滚动） ===== */
        .online-sidebar {
            flex-shrink: 0;
            background: #ffffff;
            border-top: 1px solid #e8ecf1;
            overflow: hidden;
            max-height: 80px;
            transition: max-height 0.3s ease;
        }
        .online-sidebar.expanded {
            max-height: 200px;
            overflow-y: auto;
        }
        .online-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: #888;
            background: #fff;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            flex-shrink: 0;
        }
        .online-sidebar-header .arrow {
            font-size: 10px;
            color: #999;
            transition: transform 0.3s;
        }
        .online-sidebar.expanded .online-sidebar-header .arrow {
            transform: rotate(180deg);
        }
        .online-list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 0;
            gap: 0;
            flex: 1;
        }
        .online-list::-webkit-scrollbar {
            width: 3px;
        }
        .online-list::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 10px;
        }
        .online-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.15s;
            min-height: 32px;
            flex-shrink: 0;
        }
        .online-user:active {
            background: #f0f2f5;
        }
        .online-user img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .online-user .name {
            font-size: 12px;
            color: #333;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .online-user .status {
            font-size: 11px;
            flex-shrink: 0;
        }
        .online-user .unread-badge {
            background: #ff4d4f;
            color: #fff;
            font-size: 9px;
            padding: 0 6px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ===== 模态框 ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            max-width: 480px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .modal-header h3 {
            font-size: 16px;
            color: #1a1a1a;
        }
        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #999;
            padding: 0 4px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f0f2f5;
        }
        .modal-footer button {
            padding: 6px 20px;
            border-radius: 20px;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }
        .modal-footer .btn-primary {
            background: #07c160;
            color: #fff;
        }
        .modal-footer .btn-secondary {
            background: #f0f2f5;
            color: #555;
        }

        .search-fields {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .search-fields .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .search-fields input,
        .search-fields select {
            padding: 6px 10px;
            border: 1.5px solid #e8ecf1;
            border-radius: 10px;
            font-size: 13px;
            flex: 1;
            min-width: 80px;
            outline: none;
        }
        .search-fields input:focus,
        .search-fields select:focus {
            border-color: #07c160;
        }
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .search-result-item {
            padding: 8px 10px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            font-size: 13px;
        }

        /* ===== 私聊窗口 ===== */
        .private-chat-window {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 340px;
            max-width: 92vw;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            z-index: 500;
            display: none;
            flex-direction: column;
            max-height: 60vh;
        }
        .private-chat-header {
            padding: 10px 14px;
            background: #07c160;
            color: #fff;
            border-radius: 14px 14px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .private-chat-header .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 4px;
        }
        .private-chat-header .close-btn:hover {
            opacity: 1;
        }
        .private-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f5f6fa;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 120px;
            max-height: 240px;
        }
        .private-message {
            padding: 6px 12px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .private-message-sent {
            background: #07c160;
            color: #fff;
            align-self: flex-end;
        }
        .private-message-received {
            background: #ffffff;
            color: #1a1a1a;
            align-self: flex-start;
            border: 1px solid #e8ecf1;
        }
        .private-input-area {
            display: flex;
            padding: 6px 10px;
            gap: 6px;
            border-top: 1px solid #e8ecf1;
            flex-shrink: 0;
        }
        .private-input-area input {
            flex: 1;
            padding: 6px 10px;
            border: 1.5px solid #e8ecf1;
            border-radius: 18px;
            outline: none;
            font-size: 13px;
        }
        .private-input-area input:focus {
            border-color: #07c160;
        }
        .private-input-area button {
            background: #07c160;
            border: none;
            padding: 6px 14px;
            border-radius: 18px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* ===== 大屏适配 ===== */
        @media (min-width: 769px) {
            .chat-layout {
                flex-direction: row;
                height: calc(100% - 48px);
            }
            .group-sidebar {
                max-height: none;
                height: 100%;
                width: 200px;
                border-right: 1px solid #e8ecf1;
                border-bottom: none;
                display: flex;
                flex-direction: column;
            }
            .group-sidebar-header {
                cursor: default;
                padding: 12px 16px 8px;
                font-size: 13px;
                border-bottom: 1px solid #f0f2f5;
            }
            .group-sidebar-header .arrow {
                display: none;
            }
            .group-list {
                flex: 1;
                overflow-y: auto;
                padding: 4px 0;
            }
            .group-item {
                padding: 10px 16px;
                min-height: 44px;
            }
            .group-item .icon {
                font-size: 18px;
                width: 28px;
            }
            .group-item .info .name {
                font-size: 14px;
            }
            .group-item .info .count {
                display: inline;
            }

            .online-sidebar {
                max-height: none;
                height: 100%;
                width: 180px;
                border-top: none;
                border-left: 1px solid #e8ecf1;
                display: flex;
                flex-direction: column;
            }
            .online-sidebar-header {
                cursor: default;
                padding: 12px 16px 8px;
                font-size: 13px;
                border-bottom: 1px solid #f0f2f5;
            }
            .online-sidebar-header .arrow {
                display: none;
            }
            .online-list {
                flex: 1;
                overflow-y: auto;
                padding: 4px 0;
            }
            .online-user {
                padding: 8px 16px;
                min-height: 40px;
            }
            .online-user img {
                width: 28px;
                height: 28px;
            }
            .online-user .name {
                font-size: 13px;
            }

            .message {
                max-width: 85%;
            }
            .message-avatar {
                width: 36px;
                height: 36px;
            }
            .message-bubble {
                padding: 10px 14px;
                font-size: 14px;
                border-radius: 16px;
                max-width: calc(100% - 46px);
            }
            .file-message img,
            .file-message video {
                max-width: 200px;
                max-height: 150px;
            }
            .input-area input {
                padding: 10px 14px;
                font-size: 14px;
            }
            .input-area .send-btn {
                padding: 10px 18px;
                font-size: 14px;
            }
            .emoji-panel {
                width: 280px;
                left: 16px;
                bottom: 70px;
            }
            .emoji-panel span {
                font-size: 26px;
            }
            .private-chat-window {
                width: 360px;
                max-height: 500px;
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<div class="chat-nav">
    <div class="nav-left">
        <a href="/" class="back-btn">‹</a>
        <span class="nav-title">💬 随心聊</span>
    </div>
    <div class="nav-actions">
        <button id="searchBtn" title="搜索">🔍</button>
        <button id="privateChatListBtn" title="私聊">💬</button>
    </div>
</div>

<!-- ===== 主布局 ===== -->
<div class="chat-layout">

    <!-- 群列表 -->
    <div class="group-sidebar" id="groupSidebar">
        <div class="group-sidebar-header" id="groupSidebarToggle">
            <span>📋 群聊</span>
            <div class="actions">
                <button id="createGroupBtn" title="创建群">➕</button>
                <button id="discoverGroupsBtn" title="发现群">🔍</button>
                <span class="arrow">▼</span>
            </div>
        </div>
        <div class="group-list" id="groupList">
            <div class="group-item active" data-group-id="0">
                <span class="icon">💬</span>
                <div class="info">
                    <div class="name">公共聊天室</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息面板 -->
    <div class="message-panel">
        <div class="chat-header">
            <span class="title" id="currentChatTitle">💬 公共聊天室</span>
            <div class="actions">
                <button id="groupMembersBtn" title="群成员" style="display:none;">👥</button>
            </div>
        </div>
        <div class="messages-area" id="messagesArea">
            <div class="load-more-trigger" id="loadMoreTrigger">↑ 加载更早消息</div>
        </div>
        <div class="input-panel">
            <div class="reply-bar hidden" id="replyBar">
                <span class="reply-content" id="replyContent">回复...</span>
                <button class="cancel-reply" id="cancelReplyBtn">✕</button>
            </div>
            <div class="input-area">
                <button class="emoji-btn" id="emojiBtn">😊</button>
                <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
                <button class="file-btn" id="fileBtn">📎</button>
                <button class="send-btn" id="sendBtn">发送</button>
                <input type="file" id="fileInput" style="display:none;">
                <div class="emoji-panel" id="emojiPanel"></div>
            </div>
        </div>
    </div>

    <!-- 在线用户 -->
    <div class="online-sidebar" id="onlineSidebar">
        <div class="online-sidebar-header" id="onlineSidebarToggle">
            <span>👥 在线 <span id="onlineCount">0</span></span>
            <span class="arrow">▼</span>
        </div>
        <div class="online-list" id="onlineList"></div>
    </div>
</div>

<!-- ===== 模态框 ===== -->
<div id="searchModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🔍 搜索消息</h3>
            <button class="close-btn" id="closeSearchModalBtn">&times;</button>
        </div>
        <div class="search-fields">
            <input type="text" id="searchKeyword" placeholder="关键词...">
            <input type="text" id="searchUsername" placeholder="用户名...">
            <div class="row">
                <input type="date" id="searchStartDate">
                <span style="color:#999;align-self:center;">至</span>
                <input type="date" id="searchEndDate">
            </div>
            <select id="searchType">
                <option value="all">全部消息</option>
                <option value="mine">我的消息</option>
            </select>
            <button class="btn-primary" id="doSearchBtn" style="padding:8px;border:none;border-radius:20px;background:#07c160;color:#fff;font-size:14px;cursor:pointer;">搜索</button>
        </div>
        <div class="search-results" id="searchResults"></div>
        <div class="modal-footer">
            <button class="btn-secondary" id="closeSearchModalBtn2">关闭</button>
        </div>
    </div>
</div>

<div id="groupMembersModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>👥 群成员 <span id="memberCount">0</span></h3>
            <button class="close-btn" id="closeGroupMembersBtn">&times;</button>
        </div>
        <div id="groupMemberList"></div>
        <div class="modal-footer">
            <button class="btn-secondary" id="closeGroupMembersBtn2">关闭</button>
        </div>
    </div>
</div>

<div id="createGroupModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📝 创建群聊</h3>
            <button class="close-btn" id="closeCreateGroupBtn">&times;</button>
        </div>
        <div class="search-fields">
            <input type="text" id="newGroupName" placeholder="群名称（1-20字）" maxlength="20">
            <input type="text" id="newGroupDesc" placeholder="群简介（可选）" maxlength="100">
            <button class="btn-primary" id="doCreateGroupBtn" style="padding:8px;border:none;border-radius:20px;background:#07c160;color:#fff;font-size:14px;cursor:pointer;">创建</button>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="closeCreateGroupBtn2">取消</button>
        </div>
    </div>
</div>

<div id="discoverGroupsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🔍 发现群聊</h3>
            <button class="close-btn" id="closeDiscoverGroupsBtn">&times;</button>
        </div>
        <div id="discoverGroupList"></div>
        <div class="modal-footer">
            <button class="btn-secondary" id="closeDiscoverGroupsBtn2">关闭</button>
        </div>
    </div>
</div>

<!-- ===== 私聊窗口 ===== -->
<div id="privateChatWindow" class="private-chat-window">
    <div class="private-chat-header" id="privateChatHeader">
        <span>💬 私聊</span>
        <button class="close-btn" id="closePChatBtn" onclick="closePrivateChat()">✕</button>
    </div>
    <div class="private-messages-area" id="privateMessagesArea"></div>
    <div class="private-input-area">
        <input type="text" id="privateInput" placeholder="输入私聊...">
        <button id="sendPrivateBtn">发送</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script src="chat.js"></script>

<script>
// 群列表展开/收起（手机端）
document.getElementById('groupSidebarToggle')?.addEventListener('click', function() {
    var sidebar = document.getElementById('groupSidebar');
    if (sidebar) {
        sidebar.classList.toggle('expanded');
    }
});

// 在线列表展开/收起（手机端）
document.getElementById('onlineSidebarToggle')?.addEventListener('click', function() {
    var sidebar = document.getElementById('onlineSidebar');
    if (sidebar) {
        sidebar.classList.toggle('expanded');
    }
});

// 全局关闭私聊
window.closePrivateChat = function() {
    var win = document.getElementById('privateChatWindow');
    if (win) win.style.display = 'none';
    if (window.currentPrivateTarget !== undefined) window.currentPrivateTarget = null;
    var area = document.getElementById('privateMessagesArea');
    if (area) area.innerHTML = '';
};

document.addEventListener('DOMContentLoaded', function() {
    var closeBtn = document.getElementById('closePChatBtn');
    if (closeBtn) {
        closeBtn.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.closePrivateChat();
        };
    }
});
</script>

</body>
</html>
